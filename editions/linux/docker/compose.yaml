services:
  manager:
    build:
      context: ../../..
      dockerfile: editions/linux/docker/Dockerfile
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
    cpus: 2
    restart: unless-stopped
    stop_grace_period: 40s
    tmpfs: [/tmp:size=64m,mode=1777]
    env_file: ../config/container.env
    volumes:
      - ./data:/data
      - ./secrets:/secrets:ro
      - ./tls:/tls:ro
    ports: ["127.0.0.1:8443:8080"]
