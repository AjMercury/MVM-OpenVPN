{{define "setup"}}<!doctype html><html lang="{{.Lang}}" dir="{{.Dir}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{t .Lang "setupTitle"}}</title><link rel="stylesheet" href="/static/app.css"></head><body><div class="bg-scene" aria-hidden="true"><div class="blob blob-1"></div><div class="blob blob-2"></div></div><main><section class="glass-card login"><h1>{{t .Lang "setupTitle"}}</h1><a href="/setup?lang=en">English</a> · <a href="/setup?lang=fa">فارسی</a><p>{{t .Lang "previewWarning"}}</p><p>{{t .Lang "setupHealth"}}</p><p>TLS: {{if .TLS}}{{t .Lang "configured"}}{{else}}{{t .Lang "loopbackOnly"}}{{end}}</p><p>{{.Origin}}</p><form action="/setup" method="post"><label>{{t .Lang "bootstrapToken"}}<input name="token" type="password" autocomplete="off" required></label><label>{{t .Lang "username"}}<input name="username" autocomplete="username" required maxlength="27"></label><label>{{t .Lang "password"}}<input name="password" type="password" autocomplete="new-password" minlength="14" maxlength="233" required></label><label>{{t .Lang "timezone"}}<input name="timezone" value="UTC" required></label><label>{{t .Lang "language"}}<select name="language"><option value="en">English</option><option value="fa">فارسی</option></select></label><p>{{t .Lang "setupOnboarding"}}</p><button class="primary">{{t .Lang "initialize"}}</button></form></section></main></body></html>{{end}}
